<h1>Homebridge Nest</h1>
<p>Homebridge Nest is a personal, non-commercial integration that connects my own Google Nest devices to Apple Home. It runs on Homebridge on my home Mac mini and lets me see and control my Nest Learning Thermostat, Nest cameras, and Nest doorbell from the Apple Home app.
<p>It is for my own household use only. It is not a product or a service offered to anyone else.</p>
